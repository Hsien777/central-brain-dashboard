<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股互動看板 · 2026-11-26</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1a202c; --sub:#64748b; --line:#e2e8f0;
    --red:#d62828; --green:#128a4b; --accent:#2563eb; --accentbg:#eff4ff;
    --warn:#b45309; --warnbg:#fff7ed; --chip:#f1f5f9;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f141b; --card:#1a222d; --ink:#e6edf3; --sub:#94a3b8; --line:#2a3543;
      --red:#ff5a5a; --green:#3ddc84; --accent:#5b9bff; --accentbg:#16233a;
      --warn:#f0a339; --warnbg:#2a2114; --chip:#232e3c; }
  }
  *{box-sizing:border-box}
  /*  2026-09-13 改版 B「左欄工具列」——
     大盤/篩選/計算機全部沉到左欄,表格拿到整個視窗高度。
     手機用 .rail{display:contents} 把左欄攤平成單欄 + 底部分頁,**同一份 DOM**。 */
  body{margin:0;font:15px/1.5 -apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);
    display:grid;grid-template-columns:264px minmax(0,1fr) 420px;height:100vh;overflow:hidden}
  .rail{grid-column:1;background:var(--card);border-right:1px solid var(--line);
    overflow-y:auto;display:flex;flex-direction:column}
  header{padding:14px 14px 8px;background:transparent}
  .rail h1{font-size:17px;margin:0 0 6px}
  /* 大盤區塊(加權 / 櫃買 走勢 + 量) */
  .mkt{display:flex;flex-direction:column;gap:8px;padding:2px 14px 10px;background:transparent}
  .mkt .panel{width:100%}
  .mkt .prow{flex-direction:column;align-items:stretch;gap:2px}
  .mkt .pchart{width:100%}
  .mkt .panel{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);
    border-radius:8px;padding:4px 11px 5px}
  .mkt .prow{display:flex;align-items:center;gap:9px}
  .mkt .pinfo{display:flex;flex-direction:column;line-height:1.18}
  .mkt .pname{font-size:11px;color:var(--sub)}
  .mkt .pclose{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .mkt .pchg{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .mkt .pchart{width:104px;flex:0 0 auto}
  .mkt .pbreadth{font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums;
    border-top:1px solid var(--line);padding-top:3px;margin-top:1px}
  h1{margin:0 0 8px;font-size:20px}
  h1 .d{color:var(--sub);font-weight:400;font-size:15px}
  .meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--sub)}
  .meta b{color:var(--ink)}
  .wind{display:inline-block;padding:2px 10px;border-radius:6px;background:var(--accentbg);
    color:var(--accent);font-weight:600}
  .controls{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px 14px;
    border-top:1px solid var(--line);background:transparent;font-size:13.5px}
  .controls select{width:100%}
  .controls label{display:flex;gap:5px;align-items:center;cursor:pointer;color:var(--sub)}
  .controls select{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--ink)}
  .list{grid-column:2}
  .detail{grid-column:3}
  .tabs{display:none}
  /* 1101~1300:三欄還在,但清單欄擠不下整張表(1152 時只剩 468px,欄位會互相卡)。
     縮左欄和明細,並讓表格在自己的容器裡橫捲 —— 整頁不會歪。 */
  @media(min-width:1101px) and (max-width:1300px){
    body{grid-template-columns:240px minmax(0,1fr) 372px}
    .list{padding:8px 8px 40px}
    .list table{display:block;overflow-x:auto}
    .mkt,.controls,.calc,header,.foot{padding-left:11px;padding-right:11px}
    .calc input,.calc select{width:80px}
  }
  /*  2026-09-12 修的問題(手機整個清單看不到、高度 0px)在 B 版面裡的解法不同:
     不再是「放開高度鎖」,而是把左欄攤平 + 底部分頁。根因一樣 ——
     窄螢幕不該把三欄擠在一個視窗高度裡。 */
  @media(max-width:1100px){
    /*  display:contents 讓 .rail 的小孩直接變成 body 的 flex 項目,
       所以桌面的三欄和手機的單欄**共用同一份 DOM**,不用維護兩套。 */
    body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
    .rail{display:contents}
    header{padding:12px 14px 8px;background:var(--card);border-bottom:1px solid var(--line)}
    .rail h1{font-size:18px}
    .meta{font-size:12.5px}

    .mkt{flex-direction:row;flex-wrap:wrap;padding:10px 14px;background:var(--card);
      overflow-y:auto;flex:1;min-height:0;align-content:flex-start}
    .mkt .panel{width:100%}
    .controls{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 14px;
      padding:9px 14px;background:var(--card);border-top:none;border-bottom:1px solid var(--line)}
    .controls select{width:auto}
    .calc{flex-direction:column;align-items:stretch;padding:12px 14px;background:var(--card);
      overflow-y:auto;flex:1;min-height:0;border-bottom:none}

    .list{overflow-y:auto;flex:1;min-height:0;padding:8px 10px 12px}
    .list table{display:block;overflow-x:auto;white-space:nowrap}
    th{position:static}   /* 表頭在攤平版面裡黏不住,拿掉免得黏在畫面外 */
    .detail{border-left:none;border-top:2px solid var(--line);padding:16px 14px 30px;
      overflow-y:auto;flex:0 0 auto;max-height:56vh}
    /* 還沒點任何一檔時,明細只是一句提示,不該在手機上佔掉半個螢幕。
       :has() 挑「裡面還是那句提示」的狀態;不支援 :has() 的舊瀏覽器就維持原樣,不會壞。 */
    .detail:has(.dhint){display:none}
    .foot{display:none}

    /* 底部分頁:清單 / 大盤 / 計算機 */
    .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
      background:var(--card);border-top:1px solid var(--line);
      padding:6px 0 max(8px, env(safe-area-inset-bottom))}
    .tabs button{appearance:none;background:none;border:0;font:inherit;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:6px 0;color:var(--sub);min-height:44px}
    .tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;
      stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .tabs button span{font-size:11px}
    .tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}

    body[data-tab="list"] .mkt,
    body[data-tab="list"] .calc{display:none}
    body[data-tab="mkt"]  .controls,
    body[data-tab="mkt"]  .list,
    body[data-tab="mkt"]  .detail,
    body[data-tab="mkt"]  .calc{display:none}
    body[data-tab="calc"] .controls,
    body[data-tab="calc"] .list,
    body[data-tab="calc"] .detail,
    body[data-tab="calc"] .mkt{display:none}
  }
  @media(max-width:820px){
    .rail h1{font-size:17px}
    .calc{font-size:13px}
  }
  .list{overflow:auto;padding:8px 12px 40px;min-height:0}
  .detail{overflow:auto;border-left:1px solid var(--line);background:var(--card);padding:20px 22px;min-height:0}
  .grp{margin:14px 6px 6px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.4px}
  table{width:100%;border-collapse:collapse}
  th{position:sticky;top:0;background:var(--bg);color:var(--sub);font-size:12px;font-weight:600;
    text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  th.l{text-align:left}
  td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
  td.l{text-align:left}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--accentbg)}
  tbody tr.sel{background:var(--accentbg);box-shadow:inset 3px 0 0 var(--accent)}
  .nm{font-weight:600}.cd{color:var(--sub);font-size:12.5px;margin-left:5px}
  .up{color:var(--red)}.dn{color:var(--green)}
  .tier{font-size:12px;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--sub)}
  .flag{color:var(--warn);font-size:12px;font-weight:600}
  .wt{display:inline-block;margin-left:6px;padding:0 6px;border-radius:9px;font-size:12px;font-weight:600;
      color:var(--accent);border:1px solid var(--accent)}
  .sigmini{font-size:12px;color:var(--sub)}
  .empty{color:var(--sub);padding:30px;text-align:center}
  /* detail */
  .dhint{color:var(--sub);text-align:center;margin-top:60px}
  .dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .dhead .p{font-size:30px;font-weight:700}
  .dhead .c{font-size:18px;font-weight:600}
  .drow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .chip{font-size:12.5px;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--ink)}
  .chip.buy{background:var(--accentbg);color:var(--accent);font-weight:600}
  .chip.warn{background:var(--warnbg);color:var(--warn);font-weight:600}
  /* 纏論觀察標記:空心框,刻意跟實心的訊號 chip 區隔 —— 它不篩掉任何東西 */
  .sect{font-size:11.5px;padding:1px 6px;border-radius:4px;white-space:nowrap;margin-left:4px}
  .sect.hot{background:var(--accentbg);color:var(--accent);font-weight:600}
  .sect.cold{background:var(--chip);color:var(--sub)}
  .chan{font-size:11.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);
    color:var(--sub);margin-left:4px;white-space:nowrap}
  .chip.chanc{background:transparent;border:1px dashed var(--line);color:var(--sub)}
  .chanote{font-size:11.5px;color:var(--sub);line-height:1.7;margin:6px 0 0}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:14px}
  .kv .k{color:var(--sub)}
  .kv .v{text-align:right;font-variant-numeric:tabular-nums}
  .spark{margin:14px 0 6px}
  .sparkcap{font-size:12px;color:var(--sub);display:flex;justify-content:space-between}
  .news{display:block;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    color:var(--accent);text-decoration:none;font-size:13.5px}
  .news:hover{background:var(--accentbg)}
  #daypick{font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:6px;padding:2px 6px;cursor:pointer;vertical-align:baseline}
  #daypick:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .dtag{font-size:11.5px;font-weight:700;letter-spacing:.06em;margin-left:8px;padding:2px 7px;
    border-radius:4px;background:transparent;color:transparent}
  .dtag.on{background:var(--warn);color:#fff}
  .nok{padding:26px 14px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8;
    border:1px dashed var(--line);border-radius:8px;background:var(--chip)}
  .foot{margin-top:auto;padding:12px 14px;color:var(--sub);font-size:11.5px;line-height:1.7;
    border-top:1px solid var(--line);background:transparent}
  .life-ok{color:var(--green)}.life-no{color:var(--red)}
  /* 停損計算機 */
  .calc{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:10px 14px;
    border-top:1px solid var(--line);background:transparent;font-size:13.5px}
  .calc .fld{justify-content:space-between}
  .calc input{width:88px}
  .calc select{width:88px}
  .calc .out{justify-content:space-between}
  .calc .tag{font-weight:600;color:var(--ink)}
  .calc .fld{display:flex;gap:6px;align-items:center;color:var(--sub)}
  .calc input,.calc select{background:var(--bg);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:4px 8px;font-size:13.5px;font-variant-numeric:tabular-nums;
    font-family:inherit}
  .calc input{width:82px;text-align:right}
  .calc .out{display:flex;gap:8px;align-items:baseline;padding:3px 12px;border-radius:8px;
    background:var(--warnbg)}
  .calc .out .lbl{font-size:12px;color:var(--sub)}
  .calc .out .big{font-size:21px;font-weight:700;color:var(--warn);font-variant-numeric:tabular-nums}
  .calc .out .sub{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
  .calc .risk{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
  .calc .risk b{color:var(--ink)}
  .calc .ok{color:var(--green);font-weight:600}
  .calc .bad{color:var(--red);font-weight:600}
  .calc .note{width:100%;font-size:11.5px;color:var(--sub);margin-top:-2px}
  /* ===== unslop 拋光(2026-11-24 他看過預覽後同意;unslop by @heydamir, CC BY 4.0)=====
     方向:收盤後的研究台 —— 安靜的冷灰版面,顏色只留給漲跌(紅漲綠跌)和選中的那一檔 */
  :root{ --bg:#f5f7fa; --card:#ffffff; --ink:#111827; --sub:#5b6475; --line:rgba(17,24,39,.09);
    --accent:#1d4ed8; --accentbg:#eef2f8; --warn:#9a5b13; --warnbg:#f6f1e9; --chip:#eceff4; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0d14; --card:#11141c; --ink:#eef0f5; --sub:#8f97a8; --line:rgba(238,240,245,.08);
      --accent:#7aa2ff; --accentbg:#1a1e28; --warn:#d9a441; --warnbg:#1f1c16; --chip:#1a1e28; }
  }
  body{font-variant-numeric:tabular-nums}
  .rail h1,.mkt .pclose,.mkt .pchg,th,.nm,.flag,.dhead .p,.dhead .c,#daypick,
  .calc .out .big,.calc .ok,.calc .bad,.calc .tag,.chip.buy,.chip.warn{font-weight:500}
  .wind{background:transparent;padding:0;color:var(--ink);font-weight:500}
  .grp{font-weight:500;letter-spacing:0;color:var(--ink);font-size:14px;margin:16px 8px 8px}
  .wt{border:0;padding:0;margin-left:8px;color:var(--sub);font-weight:400;border-radius:0}
  .chip{border-radius:6px;padding:2px 8px;font-size:12px}
  .sect.hot{background:transparent;color:var(--sub);font-weight:400}
  tbody tr.sel{box-shadow:inset 2px 0 0 var(--accent)}
</style>
</head>
<body data-tab="list">
<aside class="rail">
<header>
  <h1>台股互動看板 <span class="d">· </span><select id="daypick" title="切換日期(最多回看一個月)"></select><span class="dtag" id="dtag"></span></h1>
  <div class="meta">
    <span> <span class="wind" id="wind"></span></span>
    <span> 熱門族群:<b id="hot"></b></span>
    <span>🔥 族群熱度前 5:<b id="heat"></b></span>
    <span id="cnt"></span>
  </div>
</header>
<div class="mkt" id="mkt"></div>
<div class="controls">
  <span style="color:var(--sub)">篩選:</span>
  <label><input type="checkbox" id="f_mid"> 只看中小型</label>
  <label><input type="checkbox" id="f_nofin"> 只看無融資警示</label>
  <label><input type="checkbox" id="f_buy"> 只看有買點</label>
  <span style="margin-left:auto;color:var(--sub)">排序:</span>
  <select id="sort">
    <option value="chg">漲幅高→低</option>
    <option value="chgu">漲幅低→高</option>
    <option value="mcap">市值大→小</option>
    <option value="mcaps">市值小→大</option>
  </select>
</div>
<div class="calc">
  <span class="tag"> 停損計算機</span>
  <span class="fld">掛單價 <input type="number" id="c_price" step="0.05"></span>
  <span class="fld">停損
    <select id="c_pct">
      <option value="3">3%</option>
      <option value="4">4%</option>
      <option value="5" selected>5%</option>
      <option value="6">6%</option>
      <option value="8">8%</option>
      <option value="10">10%</option>
    </select>
  </span>
  <span class="out">
    <span class="lbl">停損價</span>
    <span class="big" id="c_stop">—</span>
    <span class="sub" id="c_stopsub"></span>
  </span>
  <span class="fld">部位 <input type="number" id="c_amt" step="1000"> 元</span>
  <span class="fld">本金 <input type="number" id="c_acct" step="10000"></span>
  <span class="fld">已用風險 <input type="number" id="c_used" step="0.01"> %</span>
  <span class="risk" id="c_risk">—</span>
  <div class="note">停損價已對齊台股最小跳動單位（可直接掛出去）。組合上限 4% = 手上所有部位「全部停損」時最多再賠帳戶 4%。
    <b>非投資建議，數字是你自己的規則算的。</b></div>
</div>
<div class="foot">
  ⚠️ 所有數字由程式以官方公開資料(證交所 T86／FMTQIK／MI_MARGN、FinMind、櫃買中心)計算,
  <b>非 AI 生成、非投資建議、訊號不保證</b>。買賣與停損判斷永遠在你。切線／型態請自行上 TradingView 確認。
</div>
</aside>
<div class="list" id="list"></div>
<div class="detail" id="detail"><div class="dhint">← 點左邊任一檔<br>看它的走勢、籌碼、訊號、消息</div></div>
<nav class="tabs" id="tabs" role="tablist" aria-label="手機分頁">
  <button role="tab" data-pane="list" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>清單</span></button>
  <button role="tab" data-pane="mkt" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 4 5-8 4 5"/></svg><span>大盤</span></button>
  <button role="tab" data-pane="calc" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M12 3v18"/></svg><span>計算機</span></button>
</nav>
<script>
/*  2026-09-04 加歷史紀錄:DAYS = {日期: 那天的資料},最多一個月。
   **今天是完整資料(含 60 日 K 線),歷史日是精簡版(拿掉 K 線)。**
   理由:K 線陣列佔了整份 JSON 的 80%(120KB → 24KB)。

/* 底部分頁(只在 ≤1100px 出現;桌面 .tabs 是 display:none,所以這段在桌面等於沒作用)。

   所以「同一份 DOM 兩種版面」這件事在 JS 這邊也只有這幾行。 */
function setTab(name){
  document.body.dataset.tab = name;
  document.querySelectorAll("#tabs button").forEach(b=>{
    b.setAttribute("aria-selected", String(b.dataset.pane === name));
  });
}
document.getElementById("tabs").addEventListener("click", e=>{
  const b = e.target.closest("button[data-pane]");
  if(b) setTab(b.dataset.pane);
});

// 台股最小跳動單位:算出來的停損價要能真的掛得出去,不然 162.34 是掛不了的。
function tick(p){
  if(p<10) return 0.01; if(p<50) return 0.05; if(p<100) return 0.1;
  if(p<500) return 0.5; if(p<1000) return 1; return 5;
}
function toTick(p){ const t=tick(p); const d=(t+"").split(".")[1];

function idxChart(s){
  if(!s || !s.close || s.close.length<2) return "";
  const W=140,H=38,pad=2, n=s.close.length;
  const lo=Math.min(...s.close), hi=Math.max(...s.close), rng=(hi-lo)||1;
  const X=i=>pad+i*(W-2*pad)/(n-1);
  const Y=v=>H-pad-(v-lo)/rng*(H-2*pad);
  const up=s.close[n-1]>=s.close[0], col=up?'var(--red)':'var(--green)';
  const pts=s.close.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const area=`${X(0).toFixed(1)},${(H-pad).toFixed(1)} ${pts} ${X(n-1).toFixed(1)},${(H-pad).toFixed(1)}`;
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block">
    <polygon points="${area}" fill="${col}" opacity="0.12"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.3"/></svg>`;
}

function kSVG(r){
  const k=r.k||[]; if(k.length<2) return "";
  const W=420,H=170,pad=6, n=k.length;
  const ma5=r.k_ma5||[], ma20=r.k_ma20||[], ma60=r.k_ma60||[];
  let lo=Infinity, hi=-Infinity;
  for(const c of k){ lo=Math.min(lo,c[2]); hi=Math.max(hi,c[1]); }
  for(const arr of [ma20,ma60]) for(const v of arr) if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);}
  const rng=(hi-lo)||1;
  const slot=(W-2*pad)/n, bw=Math.max(1.6, slot*0.62);
  const X=i=>pad+(i+0.5)*slot;
  const Y=v=>H-pad-(v-lo)/rng*(H-2*pad);
  let candles="";
  for(let i=0;i<n;i++){
    const o=k[i][0],h=k[i][1],l=k[i][2],c=k[i][3];
    const col=c>=o?'var(--red)':'var(--green)', x=X(i);
    const yT=Y(Math.max(o,c)), yB=Y(Math.min(o,c)), bh=Math.max(1,yB-yT);
    candles+=`<line x1="${x}" x2="${x}" y1="${Y(h)}" y2="${Y(l)}" stroke="${col}" stroke-width="1"/>`
      +`<rect x="${(x-bw/2).toFixed(1)}" y="${yT.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}"/>`;
  }
  const line=(arr,color,dash)=>{
    const pts=arr.map((v,i)=>v==null?null:`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(" ");
    return pts?`<polyline fill="none" stroke="${color}" stroke-width="1.3" ${dash?`stroke-dasharray="${dash}"`:''} points="${pts}"/>`:"";
  };
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;border-radius:6px">
    ${candles}
    ${line(ma5,'var(--sub)','')}
    ${line(ma20,'var(--accent)','')}
    ${line(ma60,'var(--warn)','5 3')}
  </svg>`;
}

function renderAll(){
  document.getElementById("wind").textContent = DATA.idxline || "—";
  document.getElementById("hot").textContent  = DATA.hot_sectors || "—";
  document.getElementById("heat").textContent = (DATA.heat_top && DATA.heat_top.length)
    ? DATA.heat_top.map(x=>x[0]+" "+x[1]).join("、")
    : (DATA.heat_err ? (isTodayHeat() ? "今天沒有資料" : "所選日期沒有資料") : "—");   // 沒資料 ≠ 沒有熱門族群
  const tag = document.getElementById("dtag");
  const isToday = DATA.date === TODAY;
  tag.textContent = isToday ? "" : "歷史";
  tag.className = isToday ? "dtag" : "dtag on";
  selected = null;
  document.getElementById("detail").innerHTML =
    '<div class="dhint">← 點左邊任一檔<br>看它的走勢、籌碼、訊號、消息</div>';
  renderMkt();
  render();
}

const pick = document.getElementById("daypick");
Object.keys(DAYS).sort().reverse().forEach(d=>{
  const o = document.createElement("option");
  o.value = d;
  o.textContent = d + (d === TODAY ? "(今天)" : "");
  pick.appendChild(o);
});
pick.value = TODAY;
pick.onchange = () => { DATA = DAYS[pick.value]; renderAll(); };

renderAll();
</script>
</body>
</html>
