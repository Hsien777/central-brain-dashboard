<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股互動看板 · 2026-08-24</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1a202c; --sub:#64748b; --line:#e2e8f0;
    --red:#d62828; --green:#128a4b; --accent:#2563eb; --accentbg:#eff4ff;
    --warn:#b45309; --warnbg:#fff7ed; --chip:#f1f5f9;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f141b; --card:#1a222d; --ink:#e6edf3; --sub:#94a3b8; --line:#2a3543;
      --red:#ff5a5a; --green:#3ddc84; --accent:#5b9bff; --accentbg:#16233a;
      --warn:#f0a339; --warnbg:#2a2114; --chip:#232e3c; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{padding:18px 24px 14px;border-bottom:1px solid var(--line);background:var(--card)}
  /* 大盤區塊(加權 / 櫃買 走勢 + 量) */
  .mkt{display:flex;flex-wrap:wrap;gap:8px;padding:7px 24px 8px;
    border-bottom:1px solid var(--line);background:var(--card)}
  .mkt .panel{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);
    border-radius:8px;padding:4px 11px 5px}
  .mkt .prow{display:flex;align-items:center;gap:9px}
  .mkt .pinfo{display:flex;flex-direction:column;line-height:1.18}
  .mkt .pname{font-size:11px;color:var(--sub)}
  .mkt .pclose{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .mkt .pchg{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .mkt .pchart{width:104px;flex:0 0 auto}
  .mkt .pbreadth{font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums;
    border-top:1px solid var(--line);padding-top:3px;margin-top:1px}
  h1{margin:0 0 8px;font-size:20px}
  h1 .d{color:var(--sub);font-weight:400;font-size:15px}
  .meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--sub)}
  .meta b{color:var(--ink)}
  .wind{display:inline-block;padding:2px 10px;border-radius:6px;background:var(--accentbg);
    color:var(--accent);font-weight:600}
  .controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 24px;
    border-bottom:1px solid var(--line);background:var(--card);font-size:13.5px}
  .controls label{display:flex;gap:5px;align-items:center;cursor:pointer;color:var(--sub)}
  .controls select{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--ink)}
  main{display:grid;grid-template-columns:1fr 460px;gap:0;flex:1;min-height:0}
  @media(max-width:1100px){main{grid-template-columns:1fr}}
  .list{overflow:auto;padding:8px 12px 40px}
  .detail{overflow:auto;border-left:1px solid var(--line);background:var(--card);padding:20px 22px}
  .grp{margin:14px 6px 6px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.4px}
  table{width:100%;border-collapse:collapse}
  th{position:sticky;top:0;background:var(--bg);color:var(--sub);font-size:12px;font-weight:600;
    text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  th.l{text-align:left}
  td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
  td.l{text-align:left}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--accentbg)}
  tbody tr.sel{background:var(--accentbg);box-shadow:inset 3px 0 0 var(--accent)}
  .nm{font-weight:600}.cd{color:var(--sub);font-size:12.5px;margin-left:5px}
  .up{color:var(--red)}.dn{color:var(--green)}
  .tier{font-size:12px;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--sub)}
  .flag{color:var(--warn);font-size:12px;font-weight:600}
  .sigmini{font-size:12px;color:var(--sub)}
  .empty{color:var(--sub);padding:30px;text-align:center}
  /* detail */
  .dhint{color:var(--sub);text-align:center;margin-top:60px}
  .dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .dhead .p{font-size:30px;font-weight:700}
  .dhead .c{font-size:18px;font-weight:600}
  .drow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .chip{font-size:12.5px;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--ink)}
  .chip.buy{background:var(--accentbg);color:var(--accent);font-weight:600}
  .chip.warn{background:var(--warnbg);color:var(--warn);font-weight:600}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:14px}
  .kv .k{color:var(--sub)}
  .kv .v{text-align:right;font-variant-numeric:tabular-nums}
  .spark{margin:14px 0 6px}
  .sparkcap{font-size:12px;color:var(--sub);display:flex;justify-content:space-between}
  .news{display:block;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    color:var(--accent);text-decoration:none;font-size:13.5px}
  .news:hover{background:var(--accentbg)}
  .foot{padding:12px 24px;color:var(--sub);font-size:12px;border-top:1px solid var(--line);background:var(--card)}
  .life-ok{color:var(--green)}.life-no{color:var(--red)}
  /* 停損計算機 */
  .calc{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 24px;
    border-bottom:1px solid var(--line);background:var(--card);font-size:13.5px}
  .calc .tag{font-weight:600;color:var(--ink)}
  .calc .fld{display:flex;gap:6px;align-items:center;color:var(--sub)}
  .calc input,.calc select{background:var(--bg);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:4px 8px;font-size:13.5px;font-variant-numeric:tabular-nums;
    font-family:inherit}
  .calc input{width:82px;text-align:right}
  .calc .out{display:flex;gap:8px;align-items:baseline;padding:3px 12px;border-radius:8px;
    background:var(--warnbg)}
  .calc .out .lbl{font-size:12px;color:var(--sub)}
  .calc .out .big{font-size:21px;font-weight:700;color:var(--warn);font-variant-numeric:tabular-nums}
  .calc .out .sub{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
  .calc .risk{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
  .calc .risk b{color:var(--ink)}
  .calc .ok{color:var(--green);font-weight:600}
  .calc .bad{color:var(--red);font-weight:600}
  .calc .note{width:100%;font-size:11.5px;color:var(--sub);margin-top:-2px}
  @media(max-width:820px){.calc input{width:70px}}
</style>
</head>
<body>
<header>
  <h1>台股互動看板 <span class="d">· 2026-08-24</span></h1>
  <div class="meta">
    <span>🧭 <span class="wind" id="wind"></span></span>
    <span>🏭 熱門族群:<b id="hot"></b></span>
    <span id="cnt"></span>
  </div>
</header>
<div class="mkt" id="mkt"></div>
<div class="controls">
  <span style="color:var(--sub)">篩選:</span>
  <label><input type="checkbox" id="f_mid"> 只看中小型</label>
  <label><input type="checkbox" id="f_nofin"> 只看無融資警示</label>
  <label><input type="checkbox" id="f_buy"> 只看有買點</label>
  <span style="margin-left:auto;color:var(--sub)">排序:</span>
  <select id="sort">
    <option value="chg">漲幅高→低</option>
    <option value="chgu">漲幅低→高</option>
    <option value="mcap">市值大→小</option>
    <option value="mcaps">市值小→大</option>
  </select>
</div>
<div class="calc">
  <span class="tag">🧮 停損計算機</span>
  <span class="fld">掛單價 <input type="number" id="c_price" step="0.05"></span>
  <span class="fld">停損
    <select id="c_pct">
      <option value="3">3%</option>
      <option value="4">4%</option>
      <option value="5" selected>5%</option>
      <option value="6">6%</option>
      <option value="8">8%</option>
      <option value="10">10%</option>
    </select>
  </span>
  <span class="out">
    <span class="lbl">停損價</span>
    <span class="big" id="c_stop">—</span>
    <span class="sub" id="c_stopsub"></span>
  </span>
  <span class="fld">部位 <input type="number" id="c_amt" step="1000"> 元</span>
  <span class="fld">本金 <input type="number" id="c_acct" step="10000"></span>
  <span class="fld">已用風險 <input type="number" id="c_used" step="0.01"> %</span>
  <span class="risk" id="c_risk">—</span>
  <div class="note">停損價已對齊台股最小跳動單位（可直接掛出去）。組合上限 4% = 手上所有部位「全部停損」時最多再賠帳戶 4%。
    <b>非投資建議，數字是你自己的規則算的。</b></div>
</div>
<main>
  <div class="list" id="list"></div>
  <div class="detail" id="detail"><div class="dhint">← 點左邊任一檔<br>看它的走勢、籌碼、訊號、消息</div></div>
</main>

// 台股最小跳動單位:算出來的停損價要能真的掛得出去,不然 162.34 是掛不了的。
function tick(p){
  if(p<10) return 0.01; if(p<50) return 0.05; if(p<100) return 0.1;
  if(p<500) return 0.5; if(p<1000) return 1; return 5;
}
function toTick(p){ const t=tick(p); const d=(t+"").split(".")[1];
  return +( Math.round(p/t)*t ).toFixed(d?d.length:0); }
const CE = id => document.getElementById(id);

function calc(){
  const price=+CE("c_price").value, pct=+CE("c_pct").value;
  const amt=+CE("c_amt").value, acct=+CE("c_acct").value||100000;
  const used=+CE("c_used").value||0;
  if(!(price>0)){ CE("c_stop").textContent="—"; CE("c_stopsub").textContent="";
    CE("c_risk").textContent="—"; return; }
  const raw=price*(1-pct/100), stop=toTick(raw);
  const realPct=(stop-price)/price*100;
  CE("c_stop").textContent=stop;
  CE("c_stopsub").textContent=`(${realPct.toFixed(2)}%${Math.abs(realPct+pct)>0.02?" · 已對齊跳動檔":""})`;
  if(!(amt>0)){ CE("c_risk").textContent="輸入部位金額 → 算股數與風險"; return; }
  const sh=Math.floor(amt/price), risk=sh*(price-stop);
  const own=acct>0?risk/acct*100:0, tot=own+used;
  const ok=tot<=4;
  CE("c_risk").innerHTML=`→ <b>${sh.toLocaleString()}</b> 股（${(sh*price).toLocaleString()} 元）`
    +` · 到停損風險 <b>${Math.round(risk).toLocaleString()}</b> 元 = 帳戶 <b>${own.toFixed(2)}%</b>`
    +` · 組合合計 <b>${tot.toFixed(2)}%</b>`
    +` <span class="${ok?"ok":"bad"}">${ok?"✅ 在 4% 上限內":"❌ 超過 4% 上限"}</span>`;
}

function idxChart(s){
  if(!s || !s.close || s.close.length<2) return "";
  const W=140,H=38,pad=2, n=s.close.length;
  const lo=Math.min(...s.close), hi=Math.max(...s.close), rng=(hi-lo)||1;
  const X=i=>pad+i*(W-2*pad)/(n-1);
  const Y=v=>H-pad-(v-lo)/rng*(H-2*pad);
  const up=s.close[n-1]>=s.close[0], col=up?'var(--red)':'var(--green)';
  const pts=s.close.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const area=`${X(0).toFixed(1)},${(H-pad).toFixed(1)} ${pts} ${X(n-1).toFixed(1)},${(H-pad).toFixed(1)}`;
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block">
    <polygon points="${area}" fill="${col}" opacity="0.12"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.3"/></svg>`;
}

    return `<div class="panel">

function kSVG(r){
  const k=r.k||[]; if(k.length<2) return "";
  const W=420,H=170,pad=6, n=k.length;
  const ma5=r.k_ma5||[], ma20=r.k_ma20||[], ma60=r.k_ma60||[];
  let lo=Infinity, hi=-Infinity;
  for(const c of k){ lo=Math.min(lo,c[2]); hi=Math.max(hi,c[1]); }
  for(const arr of [ma20,ma60]) for(const v of arr) if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);}
  const rng=(hi-lo)||1;
  const slot=(W-2*pad)/n, bw=Math.max(1.6, slot*0.62);
  const X=i=>pad+(i+0.5)*slot;
  const Y=v=>H-pad-(v-lo)/rng*(H-2*pad);
  let candles="";
  for(let i=0;i<n;i++){
    const o=k[i][0],h=k[i][1],l=k[i][2],c=k[i][3];
    const col=c>=o?'var(--red)':'var(--green)', x=X(i);
    const yT=Y(Math.max(o,c)), yB=Y(Math.min(o,c)), bh=Math.max(1,yB-yT);
    candles+=`<line x1="${x}" x2="${x}" y1="${Y(h)}" y2="${Y(l)}" stroke="${col}" stroke-width="1"/>`
      +`<rect x="${(x-bw/2).toFixed(1)}" y="${yT.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}"/>`;
  }
  const line=(arr,color,dash)=>{
    const pts=arr.map((v,i)=>v==null?null:`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(" ");
    return pts?`<polyline fill="none" stroke="${color}" stroke-width="1.3" ${dash?`stroke-dasharray="${dash}"`:''} points="${pts}"/>`:"";
  };
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;border-radius:6px">
    ${candles}
    ${line(ma5,'var(--sub)','')}
    ${line(ma20,'var(--accent)','')}
    ${line(ma60,'var(--warn)','5 3')}
  </svg>`;
}

        <b style="color:var(--sub)">MA5</b>　<b style="color:var(--accent)">MA20</b>　<b style="color:var(--warn)">MA60 生命線┄</b></span>
      <span>${life}</span></div>
    <div class="kv">
      <div class="k">規模／市值</div><div class="v">${esc(r.size||"—")}　${r.mcap_e?r.mcap_e+" 億":""}</div>
      <div class="k">產業</div><div class="v">${esc(r.industry||"—")}</div>
      <div class="k">MA5 / MA20 / MA60(生命線)</div><div class="v">${r.ma5??"—"} / ${r.ma20??"—"} / ${r.ma60??"—"}</div>
      <div class="k">KD</div><div class="v">K ${r.K??"—"}　D ${r.D??"—"}</div>
      <div class="k">成交量(張)</div><div class="v">${(r.vol||0).toLocaleString()}</div>
      <div class="k">投信 / 外資買賣超(張)</div><div class="v"><span class="${cls(r.trust)}">${sgn(r.trust)}</span> / <span class="${cls(r.foreign)}">${sgn(r.foreign)}</span></div>
      <div class="k">融資(散戶籌碼)</div><div class="v">${fin}</div>
    </div>
    ${news}
    <p style="color:var(--sub);font-size:12px;margin-top:16px">
      提醒:融資「價漲量減=好、價跌量增=逃」;⚠訊號只是踩煞車,不是買賣訊。判斷在你。</p>`;
}
["f_mid","f_nofin","f_buy"].forEach(id=>document.getElementById(id).onchange=render);
document.getElementById("sort").onchange=render;
render();
</script>
</body>
